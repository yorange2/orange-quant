# =============================================================
# Orange Quant Binance spot experiment — 42 coins
# =============================================================
# Data source: Binance public API (2020-01 ~ 2026-06)
# Coins: 20 blue chips (BTC, ETH, SOL, etc.)
# Costs: spot taker 0.1% x2 (Binance standard fee rate)
# =============================================================

qlib_init:
    provider_uri: "data/qlib_data/binance"

data:
    instruments: all

train:
    start: "2020-01-01"
    end: "2025-06-30"
valid:
    start: "2025-07-01"
    end: "2026-01-31"
test:
    start: "2026-02-01"
    end: "2026-06-27"

model:
    kwargs:
        loss: mse
        num_boost_round: 500
        early_stopping_rounds: 50
        learning_rate: 0.03
        num_leaves: 64
        feature_fraction: 0.7
        bagging_fraction: 0.7
        bagging_freq: 1
        min_data_in_leaf: 50
        lambda_l1: 0.5
        lambda_l2: 0.5
        verbose_eval: 50

strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy.signal_strategy
    kwargs:
        signal: <PRED>
        topk: 12               # Hold the top 12 out of 20 coins
        n_drop: 3               # Rotate 3 per day
        hold_thresh: 1
        risk_degree: 0.95

backtest:
    benchmark: BTC
    account: 1000000
    freq: day
    exchange_kwargs:
        freq: day
        limit_threshold: 1.0
        deal_price: close
        open_cost: 0.001            # Binance spot taker 0.1%
        close_cost: 0.001           # Binance spot taker 0.1%
        min_cost: 0
