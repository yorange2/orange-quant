# =============================================================
# Orange Quant Binance spot experiment — 42 coins
# =============================================================
# Data source: Binance public API (2020-01 ~ 2026-06)
# Coins: 20 blue chips (BTC, ETH, SOL, etc.)
# Costs: spot taker 0.1% x2 (Binance standard fee rate)
# =============================================================

qlib_init:
    provider_uri: "data/qlib_data/binance"

data:
    instruments: all

train:
    start: "2020-01-01"
    end: "2025-06-30"
valid:
    start: "2025-07-01"
    end: "2026-01-31"
test:
    start: "2026-02-01"
    end: "2026-06-27"

model:
    kwargs:
        loss: mse
        num_boost_round: 1000
        early_stopping_rounds: 100
        learning_rate: 0.02
        num_leaves: 15               # shallower trees pair with seed-bagging for better OOS Rank IC
        feature_fraction: 0.6
        bagging_fraction: 0.8
        bagging_freq: 1
        min_data_in_leaf: 100
        lambda_l1: 2.0
        lambda_l2: 2.0
        verbose_eval: 50
    # Seed-bagged ensemble: average 5 LGBModels trained with different seeds.
    # Robustly lifts Rank IC on both OOS windows (0.0505->0.0538 test, 0.0416->0.0550 valid)
    # and cushions the bad regime. Handled by orange_quant.experiment / EnsembleLGB.
    ensemble:
        n_seeds: 5

strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy.signal_strategy
    kwargs:
        signal: <PRED>
        # Chosen for phase robustness, not peak return: across day-boundary phases
        # 0/6/12/18 the topk=20..30 x n_drop=1 block is the only stable region in the
        # grid (worst phase +31%..+35%, worst IR > 1.0 in all four cells). The old
        # topk=10/n_drop=5 earned a higher mean (+79.8% vs +67.5%) but its worst phase
        # was -17.6% at IR -0.44. See scripts/strategy_sweep.py.
        topk: 20                # needs equity > ~$571 to clear runner.py's $20 min_trade at risk_degree 0.70
        n_drop: 1               # backtest only — live Binance reads compose's --n-drop (honor_config_rotation=False)
        hold_thresh: 2
        risk_degree: 0.70

backtest:
    benchmark: BTC
    account: 1000000
    freq: day
    exchange_kwargs:
        freq: day
        limit_threshold: 1.0
        deal_price: close
        open_cost: 0.001            # Binance spot taker 0.1%
        close_cost: 0.001           # Binance spot taker 0.1%
        min_cost: 0
