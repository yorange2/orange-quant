# =============================================================
# Orange Quant Binance spot experiment — 42 coins
# =============================================================
# Data source: Binance public API (2020-01 ~ 2026-06)
# Coins: 20 blue chips (BTC, ETH, SOL, etc.)
# Costs: spot taker 0.1% x2 (Binance standard fee rate)
# =============================================================

qlib_init:
    provider_uri: "data/qlib_data/binance"

data:
    instruments: all

train:
    start: "2020-01-01"
    end: "2025-06-30"
valid:
    start: "2025-07-01"
    end: "2026-01-31"
test:
    start: "2026-02-01"
    end: "2026-06-27"

model:
    kwargs:
        loss: mse
        num_boost_round: 1000
        early_stopping_rounds: 100
        learning_rate: 0.02
        num_leaves: 15               # shallower trees pair with seed-bagging for better OOS Rank IC
        feature_fraction: 0.6
        bagging_fraction: 0.8
        bagging_freq: 1
        min_data_in_leaf: 100
        lambda_l1: 2.0
        lambda_l2: 2.0
        verbose_eval: 50
    # Seed-bagged ensemble: average 5 LGBModels trained with different seeds.
    # Robustly lifts Rank IC on both OOS windows (0.0505->0.0538 test, 0.0416->0.0550 valid)
    # and cushions the bad regime. Handled by orange_quant.experiment / EnsembleLGB.
    ensemble:
        n_seeds: 5

strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy.signal_strategy
    kwargs:
        signal: <PRED>
        topk: 10               # concentrate to top 10 (best OOS IR; also eases min-notional on a small account)
        n_drop: 5               # partial rotation (see compose --n-drop/--hold-thresh; live must be told, it defaults to full rotation)
        hold_thresh: 2
        risk_degree: 0.95

backtest:
    benchmark: BTC
    account: 1000000
    freq: day
    exchange_kwargs:
        freq: day
        limit_threshold: 1.0
        deal_price: close
        open_cost: 0.001            # Binance spot taker 0.1%
        close_cost: 0.001           # Binance spot taker 0.1%
        min_cost: 0
