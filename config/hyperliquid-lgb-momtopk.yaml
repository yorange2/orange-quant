# =============================================================
# Orange Quant Hyperliquid spot experiment
# =============================================================
# Data source: Hyperliquid REST API
# Coins: top N by volume (50 by default)
# Costs: spot taker 0.05% x2 (Hyperliquid standard fee rate)
# =============================================================

qlib_init:
    provider_uri: "data/qlib_data/hyperliquid"

data:
    instruments: all

train:
    start: "2022-01-01"
    end: "2025-06-30"
valid:
    start: "2025-07-01"
    end: "2026-01-31"
test:
    start: "2026-02-01"
    end: "2026-06-27"

model:
    kwargs:
        loss: mse
        num_boost_round: 2000
        early_stopping_rounds: 100
        learning_rate: 0.02
        num_leaves: 8
        feature_fraction: 0.5
        bagging_fraction: 0.8
        bagging_freq: 1
        min_data_in_leaf: 200
        lambda_l1: 3.0
        lambda_l2: 3.0
        verbose_eval: 50

strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy.signal_strategy
    kwargs:
        signal: <PRED>
        topk: 12
        n_drop: 3               # higher rotation: fresher signal lifts IR and halves drawdown OOS (costs are only 0.05%)
        hold_thresh: 2
        risk_degree: 0.95

backtest:
    benchmark: BTC
    account: 1000000
    freq: day
    exchange_kwargs:
        freq: day
        limit_threshold: 1.0
        deal_price: close
        open_cost: 0.0005            # Hyperliquid taker 0.05%
        close_cost: 0.0005           # Hyperliquid taker 0.05%
        min_cost: 0
