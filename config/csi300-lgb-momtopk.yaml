# =============================================================
# Orange Quant workflow config file
# =============================================================
# Usage:
#   python -c "from biance_lgb_momtopk.workflow.experiment import run_from_yaml; run_from_yaml('config/csi300-lgb-momtopk.yaml')"
# =============================================================

# -- qlib initialization --
qlib_init:
    provider_uri: "data/qlib_data/cn_data"  # qlib data directory
    region: cn                                   # A-share market

# -- Data config --
data:
    instruments: csi300                         # Stock universe: csi300 / csi500 / all
    start_time: "2010-01-01"                    # Data start
    end_time: "2020-08-01"                      # Data end

# -- Training set --
train:
    start: "2010-01-01"
    end: "2014-12-31"

# -- Validation set --
valid:
    start: "2015-01-01"
    end: "2016-12-31"

# -- Test set (backtest period) --
test:
    start: "2017-01-01"
    end: "2020-08-01"

# -- Model config (biance_lgb_momtopk LightGBM trainer) --
model:
    kwargs:
        loss: mse
        num_boost_round: 500
        early_stopping_rounds: 50
        learning_rate: 0.05
        num_leaves: 64
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 5
        verbose_eval: 50

# -- Strategy config (biance_lgb_momtopk momentum TopK strategy) --
strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy.signal_strategy
    kwargs:
        signal: <PRED>     # Use the model's predicted score
        topk: 50            # Hold 50 stocks
        n_drop: 5           # Rotate 5 stocks per day
        hold_thresh: 1      # Hold at least 1 day
        risk_degree: 0.95   # Position sizing ratio

# -- Backtest config --
backtest:
    benchmark: SH000300    # CSI 300 benchmark
    account: 100000000      # Initial capital: 100 million
    freq: day               # Daily frequency trading
