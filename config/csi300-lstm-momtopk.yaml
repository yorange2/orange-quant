# =============================================================
# Orange Quant deep learning experiment — LSTM
# =============================================================
# Usage:
#   python -c "from biance_lgb_momtopk.workflow.experiment import run_dl_from_yaml; run_dl_from_yaml('config/csi300-lstm-momtopk.yaml')"
# =============================================================

# -- qlib initialization --
qlib_init:
    provider_uri: "data/qlib_data/cn_data"
    region: cn

# -- Data config --
data:
    instruments: csi300

# -- Training / validation / test sets --
train:
    start: "2008-01-01"
    end: "2014-12-31"
valid:
    start: "2015-01-01"
    end: "2016-12-31"
test:
    start: "2017-01-01"
    end: "2020-08-01"

# -- Deep learning model config --
model:
    name: LSTM
    kwargs:
        d_feat: 20
        hidden_size: 64
        num_layers: 2
        dropout: 0.0
        n_epochs: 100
        lr: 0.001
        early_stop: 10
        batch_size: 800
        metric: loss
        loss: mse
        GPU: 0

# -- Time-series dataset config --
dataset:
    step_len: 20               # Lookback window length (days)

# -- Strategy config --
strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy.signal_strategy
    kwargs:
        signal: <PRED>
        topk: 50
        n_drop: 5
        hold_thresh: 1
        risk_degree: 0.95

# -- Backtest config --
backtest:
    benchmark: SH000300
    account: 100000000
    freq: day
