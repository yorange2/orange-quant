# =============================================================
# Orange Quant RL rotation config — csi300 top50, 离散仓位档位
# 数据已扩展至 2026-08（腾讯行情），回测窗口全部落在新数据上
# =============================================================
# Usage:
#   ../.venv/bin/python -m csi300_rl_rotation.train csi300-rl-rotation
#   ../.venv/bin/python -m csi300_rl_rotation.backtest csi300-rl-rotation
# =============================================================

# -- qlib initialization --
qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"  # 扩展后的数据（2026-08-07）
    region: cn                                  # A-share market

# -- Data config --
data:
    instruments: csi300                         # Stock universe: csi300 / csi500 / all
    start_time: "2010-01-01"                    # Data start
    end_time: "2026-08-01"                      # Data end

# -- Training set --
train:
    start: "2013-01-01"
    end: "2020-12-31"

# -- Validation set --
valid:
    start: "2021-01-01"
    end: "2022-12-31"

# -- Test set (backtest period) --
test:
    start: "2023-01-01"
    end: "2026-08-01"

# -- Universe: freeze the top-N liquid csi300 names before training starts --
universe:
    freeze_date: "2012-12-31"                   # 冻结日（train 起点前最后交易日）
    top_n: 50                                   # 按流动性取 top50
    liquidity_start: "2012-01-01"               # 流动性窗口起点（冻结日前整年）

# -- Features --
features:
    warmup_start: "2012-07-01"                  # 特征预热窗（60 日动量所需，只算特征不进收益）

# -- RL environment --
env:
    horizon: 120                                # 训练/验证 episode 步数（约一季度）
    tiers: [0, 0.3333, 0.6667, 1.0]             # 档位 → 基础权重
    max_weight: 0.10                            # 单票权重上限（归一化后封顶）
    cost_rate: 0.001                            # 单边换手成本
    turnover_penalty: 0.005                     # 换手正则（抑制每日剧烈调仓）
    baseline_reward: true                       # 差分奖励（相对等权基准，学 alpha）

# -- Model config --
model:
    hidden: [256, 256]                          # actor/critic 共享 MLP 隐层
    device: cpu                                 # cpu / mps / cuda

# -- PPO config (tianshou) --
ppo:
    lr: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    eps_clip: 0.2
    vf_coef: 0.5
    ent_coef: 0.001
    max_grad_norm: 0.5
    reward_normalization: true
    value_clip: true
    max_batchsize: 256
    max_epoch: 50
    step_per_epoch: 4096
    step_per_collect: 4096
    repeat_per_collect: 10                      # = PPO epoch 数
    batch_size: 256
    num_envs: 4
    test_episodes: 20                           # valid 段评估 episode 数
    seed: 42

# -- Paths --
paths:
    model_dir: "models/csi300-rl-rotation"
    output_dir: "outputs/csi300-rl-rotation"
    cache_dir: "data/csi300-rl-rotation"
