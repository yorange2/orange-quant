# =============================================================
# Orange Quant RL rotation — A股 csi300 研究（腾讯行情直连，tianshou PPO）
# 数据：data/cn_raw（腾讯 K 线 hfq，end 锚定分页全量抓取）
# =============================================================
# Usage:
#   ../.venv/bin/python -m orange_quant.data.tencent --symbols-file <list>   # 抓数据
#   ../.venv/bin/python -m orange_quant.rl.dataset csi300-rl-rotation        # 构建 npz
#   ../.venv/bin/python -m orange_quant.rl.train csi300-rl-rotation          # 训练
#   ../.venv/bin/python -m orange_quant.rl.backtest csi300-rl-rotation       # 回测
# =============================================================

# -- Market --
market:
    type: cn                                   # cn: 纯研究；crypto: 研究 + 实盘
    venue: tencent
    benchmark_symbol: SH000300                 # 回测基准（腾讯指数）
    quote_ccy: CNY

# -- Data config --
data:
    raw_dir: "data/cn_raw"                     # 腾讯抓取产物（每符号一个 CSV）
    start_time: "2011-01-01"                   # 下载起点（覆盖预热 + 训练）
    end_time: "2026-08-07"

# -- Universe: freeze the top-N most liquid names before training --
universe:
    provider: liquidity                        # 纯流动性冻结（本地 CSV 计算，零额外 API）
    membership: null                           # 可选: csi300（当前成分快照近似，akshare）
    raw_dir: "data/cn_raw"
    freeze_date: "2012-12-31"                  # 冻结日（train 起点前）
    liquidity_start: "2012-01-01"              # 流动性窗口起点（冻结日前整年）
    top_n: 50
    min_history_days: 100                      # 2012 窗口仅 ~242 交易日，需低于窗长

# -- Features --
features:
    warmup_start: "2012-07-01"                 # 特征预热窗（60 日动量所需，只算特征不进收益）

# -- Training set --
train:
    start: "2013-01-01"
    end: "2020-12-31"

# -- Validation set --
valid:
    start: "2021-01-01"
    end: "2022-12-31"

# -- Test set (backtest period) --
test:
    start: "2023-01-01"
    end: "2026-08-01"

# -- RL environment --
env:
    horizon: 120                                # 训练/验证 episode 步数（约一季度）
    tiers: [0, 0.3333, 0.6667, 1.0]             # 档位 → 基础权重
    max_weight: 0.10                            # 单票权重上限（归一化后封顶）
    cost_rate: 0.001                            # 单边换手成本
    turnover_penalty: 0.005                     # 换手正则（只用于训练引导）
    baseline_reward: true                       # 差分奖励（相对等权基准，学 alpha）

# -- Model config --
model:
    hidden: [256, 256]                          # actor/critic 共享 MLP 隐层
    device: cpu                                 # cpu / mps / cuda

# -- PPO config (tianshou) --
ppo:
    lr: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    eps_clip: 0.2
    vf_coef: 0.5
    ent_coef: 0.001
    max_grad_norm: 0.5
    reward_normalization: true
    value_clip: true
    max_batchsize: 256
    max_epoch: 50
    step_per_epoch: 4096
    step_per_collect: 4096
    repeat_per_collect: 10                      # = PPO epoch 数
    batch_size: 256
    num_envs: 4
    test_episodes: 20                           # valid 段评估 episode 数
    seed: 42

# -- Backtest --
backtest:
    bars_per_year: 252                 # policy-step bars per year (annualization)

# -- Paths --
paths:
    model_dir: "models/csi300-rl-rotation"
    output_dir: "outputs/csi300-rl-rotation"
    cache_dir: "data/csi300-rl-rotation"
