[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orange-quant"
version = "0.2.0"
description = "Quantitative trading framework — Tencent/Binance/Hyperliquid data, tianshou RL"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "yorange2" }
]

dependencies = [
    "tianshou>=0.4.10,<0.5",
    "gym==0.26.2",
    "torch>=2.5",
    "numpy",
    "pandas",
    "pyyaml",
    "requests",
    "ccxt",
    "python-dotenv",
    "akshare",
    "mlflow",
    "matplotlib",
    "lightgbm>=4.7,<5",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "black",
    "isort",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orange_quant*"]
