services:
  orange-quant:
    build: .
    image: orange-quant:latest
    container_name: orange-quant
    restart: unless-stopped

    env_file:
      - .env

    # 挂载模型和数据（需先在服务器上下载好）
    volumes:
      - ./models:/app/models
      - ./data:/app/data

    # 默认每日 00:15 UTC 调仓（北京时间 08:15）
    # 使用 LightGBM 模型预测，如不需要可删除 --model 参数（退化为动量策略）
    command: ["--retrain", "--hour", "0", "--minute", "11", "--model", "models/binance-lgb-momtopk.pkl"]

    profiles:
      - live

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # DRY RUN 模式（观察用，不下单）
  orange-quant-dry:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-dry
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--retrain", "--dry-run", "--hour", "09", "--minute", "01", "--model", "models/binance-lgb-momtopk.pkl"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - dry-run

  # 手动执行一次（测试/部署验证用）
  orange-quant-once:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-once
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--once", "--retrain", "--dry-run", "--model", "models/binance-lgb-momtopk.pkl"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - once
