services:
  orange-quant:
    build: .
    image: orange-quant:latest
    container_name: orange-quant
    restart: unless-stopped

    env_file:
      - .env

    # Mount models and data (must be downloaded on the server beforehand)
    volumes:
      - ./models:/app/models
      - ./data:/app/data

    # Rebalance daily at 00:15 UTC (08:15 Beijing time) by default
    # Uses LightGBM model predictions; remove --model if not needed (falls back to the momentum strategy)
    command: ["--retrain", "--hour", "0", "--minute", "11", "--model", "models/binance-lgb-momtopk.pkl"]

    profiles:
      - live

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # DRY RUN mode (observation only, no orders placed)
  orange-quant-dry:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-dry
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--retrain", "--dry-run", "--hour", "09", "--minute", "01", "--model", "models/binance-lgb-momtopk.pkl"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - dry-run

  # Run once manually (for testing/deployment verification)
  orange-quant-once:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-once
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--once", "--retrain", "--dry-run", "--model", "models/binance-lgb-momtopk.pkl"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - once
