services:
  # ── Binance live ────────────────────────────────────────────
  orange-quant-binance:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-binance
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "binance-rl-rotation", "--hour", "0", "--minute", "15"]
    profiles:
      - binance-live
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Hyperliquid live ────────────────────────────────────────
  orange-quant-hl:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-hl
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "hyperliquid-rl-rotation", "--hour", "0", "--minute", "15"]
    profiles:
      - hl-live
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── One-shot dry runs (deployment verification) ─────────────
  orange-quant-binance-once:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-binance-once
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "binance-rl-rotation", "--once", "--dry-run"]
    profiles:
      - binance-once
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # LGB 滚动 24h 视角混合（PR #36 的采纳设计）。打分需要 data/binance_h1_raw
  # 与 h00 特征缓存，两者都从挂载的 ./data 读；模型在挂载的 ./models。
  # 服务器在整点后几分钟跑：每个视角要的是**已收盘**的小时线。
  orange-quant-rolling24h:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-rolling24h
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "binance-lgb-rolling24h", "--hour", "0", "--minute", "5"]
    profiles:
      - rolling24h-live
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  orange-quant-rolling24h-once:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-rolling24h-once
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "binance-lgb-rolling24h", "--once", "--dry-run"]
    profiles:
      - rolling24h-once
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  orange-quant-hl-once:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-hl-once
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "hyperliquid-rl-rotation", "--once", "--dry-run"]
    profiles:
      - hl-once
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
