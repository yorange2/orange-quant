services:
  # ── Binance live ────────────────────────────────────────────
  orange-quant-binance:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-binance
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "binance-rl-rotation", "--hour", "0", "--minute", "15"]
    profiles:
      - binance-live
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Hyperliquid live ────────────────────────────────────────
  orange-quant-hl:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-hl
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "hyperliquid-rl-rotation", "--hour", "0", "--minute", "15"]
    profiles:
      - hl-live
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── One-shot dry runs (deployment verification) ─────────────
  orange-quant-binance-once:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-binance-once
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "binance-rl-rotation", "--once", "--dry-run"]
    profiles:
      - binance-once
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  orange-quant-hl-once:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-hl-once
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "hyperliquid-rl-rotation", "--once", "--dry-run"]
    profiles:
      - hl-once
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
