services:
  # ── Binance live ────────────────────────────────────────────
  orange-quant-binance:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-binance
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "binance-rl-rotation", "--hour", "0", "--minute", "15"]
    profiles:
      - binance-live
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Hyperliquid live ────────────────────────────────────────
  orange-quant-hl:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-hl
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "hyperliquid-rl-rotation", "--hour", "0", "--minute", "15"]
    profiles:
      - hl-live
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── One-shot dry runs (deployment verification) ─────────────
  orange-quant-binance-once:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-binance-once
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "binance-rl-rotation", "--once", "--dry-run"]
    profiles:
      - binance-once
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # LGB 滚动 24h 视角混合。打分需要 data/binance_h1_raw 与 lag0f1 特征缓存，
  # 两者都从挂载的 ./data 读；模型在挂载的 ./models。
  # 服务器在整点后几分钟跑：每个视角要的是**已收盘**的小时线。
  #
  # 2026-08-20 起用 -lag0f1 配置（D 路线）：标签对齐到实盘当日成交口径
  # (label.exec_lag=0)，同时把成交那根 bar 挡在特征之外 (features.lag=1)。
  # 只做前者会让特征与标签共享 close[t] 的微观结构噪声，回测 Sharpe 从 2.32
  # 塌到 0.30 —— 两个开关必须成对，理由见配置文件头注释。
  # ⚠ config/ 是 COPY 进镜像的（非挂载），改配置后必须 --build 才生效。
  orange-quant-rolling24h:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-rolling24h
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "binance-lgb-rolling24h-lag0f1", "--hour", "0", "--minute", "5"]
    profiles:
      - rolling24h-live
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  orange-quant-rolling24h-once:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-rolling24h-once
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "binance-lgb-rolling24h-lag0f1", "--once", "--dry-run"]
    profiles:
      - rolling24h-once
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  orange-quant-hl-once:
    build: .
    image: orange-quant:latest
    container_name: orange-quant-hl-once
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["--config", "hyperliquid-rl-rotation", "--once", "--dry-run"]
    profiles:
      - hl-once
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
